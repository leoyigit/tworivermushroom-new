<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How We Grow · Two River Gourmet Mushroom</title>
<meta name="description" content="From spore to harvest — how Two River grows USDA Organic gourmet mushrooms by hand in small batches.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/theme-river.css">
</head>
<body data-page="grow">
<div id="site-header"></div>

<main>
  <section class="pagehead">
    <div class="wrap inner">
      <div class="eyebrow">How we grow</div>
      <h1>From spore to harvest</h1>
      <p>Every mushroom we sell is grown indoors, by hand, in small organic batches. Here’s how a block of sawdust becomes dinner.</p>
    </div>
  </section>

  <section style="max-width:900px;margin:0 auto;padding:56px 28px 80px">
    <div id="steps"></div>
    <div class="center" style="margin-top:48px"><a class="btn btn-terra" href="shop.html">Taste the result</a></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script>
  window.TRMpageInit = function(){
    document.getElementById('steps').innerHTML = TRM.GROW.map(s =>
      `<div class="step"><div class="step-num">${s.n}</div><div><h3>${s.title}</h3><p>${s.body}</p></div></div>`).join('');
  };
</script>
<script src="assets/site.js"></script>
</body>
</html>
