<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meet the Team · Two River Gourmet Mushroom</title>
<meta name="description" content="Meet KC Sullivan, Kurt Cavano, and Scott Szegeski — the small crew behind Two River Gourmet Mushroom.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/theme-river.css">
</head>
<body data-page="team">
<div id="site-header"></div>

<main>
  <section class="pagehead">
    <div class="wrap inner">
      <div class="eyebrow">Meet the team</div>
      <h1>The people behind the mushrooms</h1>
      <p>A small crew who care a lot about doing this the slow, organic way.</p>
    </div>
  </section>

  <section class="wrap" style="padding:56px 28px 24px">
    <div class="team-feature" id="teamFeature"></div>
  </section>

  <section class="wrap" style="padding:24px 28px 80px">
    <div class="team-row" id="teamGrid"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script>
  window.TRMpageInit = function(){
    function show(id){
      var t = TRM.TEAM.find(function(m){ return m.id === id; }) || TRM.TEAM[0];
      document.getElementById('teamFeature').innerHTML =
        '<div class="media-rounded team-feature-photo"><img src="' + t.img + '" alt="' + t.name + '" style="object-position:' + (t.pos || '50% 50%') + '"></div>' +
        '<div>' +
          '<div class="eyebrow" style="color:var(--terra);margin-bottom:10px;font-size:11px">' + t.role + '</div>' +
          '<h2 style="font-size:30px;margin:0 0 12px">' + t.name + '</h2>' +
          '<p style="font-size:16px;line-height:1.7;color:var(--muted)">' + t.bio + '</p>' +
        '</div>';
      document.querySelectorAll('#teamGrid .tmate').forEach(function(el){
        el.classList.toggle('active', el.dataset.id === t.id);
      });
      history.replaceState(null, '', '#' + t.id);
    }

    document.getElementById('teamGrid').innerHTML = TRM.TEAM.map(function(t){
      return '<button type="button" class="tmate" data-id="' + t.id + '">' +
        '<img src="' + t.img + '" alt="' + t.name + '" style="object-position:' + (t.pos || '50% 50%') + '">' +
        '<b>' + t.name + '</b><span>' + t.role + '</span></button>';
    }).join('');

    document.getElementById('teamGrid').addEventListener('click', function(e){
      var btn = e.target.closest('.tmate');
      if(btn) show(btn.dataset.id);
    });

    var fromHash = (location.hash || '').replace('#','');
    show(fromHash);
  };
</script>
<script src="assets/site.js"></script>
</body>
</html>
