<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Returns &amp; Refunds · Two River Gourmet Mushroom</title>
<meta name="description" content="Two River Gourmet Mushroom returns and refunds policy for fresh mushrooms, broth and merchandise.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="https://www.tworivermushroom.com/cdn/shop/files/Two_River_Mushroom_Logo.png?height=64&v=1704324073">
<link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="returns">
<div id="site-header"></div>

<main>
  <section class="pagehead">
    <div class="wrap inner">
      <div class="eyebrow">Policies</div>
      <h1>Returns &amp; refunds</h1>
      <p>We’re a small farm dealing in fresh, perishable food. Here’s how returns work.</p>
    </div>
  </section>

  <section style="max-width:760px;margin:0 auto;padding:56px 28px 80px">
    <div id="policyList"></div>
    <div style="margin-top:36px;background:#e7dcc6;border-radius:14px;padding:24px 28px">
      <p style="font-size:15px;line-height:1.65;color:var(--ink2);margin:0">Questions about an order? <a href="contact.html" style="color:var(--terra);font-weight:600;text-decoration:underline;text-underline-offset:3px">Contact us</a> and we’ll make it right.</p>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/data.js"></script>
<script>
  window.TRMpageInit = function(){
    document.getElementById('policyList').innerHTML = TRM.POLICIES.map(p =>
      `<div style="padding:28px 0;border-bottom:1px solid var(--line)">
        <h3 style="font-size:24px;margin:0 0 10px">${p.title}</h3>
        <p style="font-size:16px;line-height:1.7;color:var(--muted);margin:0">${p.body}</p></div>`).join('');
  };
</script>
<script src="assets/site.js"></script>
</body>
</html>
